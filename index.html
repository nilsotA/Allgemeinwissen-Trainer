<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Wissenswerk – Allgemeinwissen trainieren</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Täglich 10 Minuten Allgemeinwissen mit Spaced Repetition – für Quizduelle und den Alltag.">
<meta name="theme-color" content="#17120e">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- Nicht black-translucent: dabei zeichnet iOS die Uhr und die Symbole der
     Statusleiste immer hell. Auf dem hellen Farbschema stehen sie dann weiss
     auf fast weissem Grund und sind nicht zu lesen. Mit "default" faerbt iOS
     die Leiste nach theme-color, und die App zieht theme-color beim Wechsel
     des Farbschemas mit. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wissenswerk">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="./assets/css/app.css">
<!-- Ohne diese Zeilen findet der Browser die Kartendaten erst, nachdem er
     index.html, app.js und data/index.js nacheinander geladen und ausgewertet
     hat - vier Runden Wartezeit hintereinander. Mit Vorabruf laufen sie
     gleichzeitig. Auf langsamem Mobilfunk macht das mehrere Sekunden aus.
     Die Liste haelt scripts/make-sw.mjs mit dem Ordner data/ synchron. -->
<link rel="modulepreload" href="./assets/js/app.js">
<link rel="modulepreload" href="./data/index.js">
<link rel="modulepreload" href="./data/all.js">
<link rel="modulepreload" href="./data/cats.js">
<link rel="modulepreload" href="./data/facts.js">
<link rel="modulepreload" href="./data/geo.js">
<link rel="modulepreload" href="./data/ges.js">
<link rel="modulepreload" href="./data/kul.js">
<link rel="modulepreload" href="./data/mat.js">
<link rel="modulepreload" href="./data/nat.js">
<link rel="modulepreload" href="./data/pol.js">
<link rel="modulepreload" href="./data/spo.js">
<link rel="modulepreload" href="./data/spr.js">
<!-- Farbschema vor dem ersten Anstrich setzen. Der Rest der App kommt erst
     nach einem halben Megabyte Modulen an; bis dahin blitzte die App im
     falschen Schema auf und die Statusleiste stand auf der falschen Farbe.
     Bewusst ohne Modul, ohne Import, mit eigenem try: schlaegt das hier fehl,
     uebernimmt applyTheme() spaeter wie bisher. -->
<script>
(function () {
  try {
    var t = (JSON.parse(localStorage.getItem('wissenswerk.v1') || '{}').settings || {}).theme || 'system';
    if (t !== 'system' && t !== 'light' && t !== 'dark') t = 'system';
    var root = document.documentElement;
    if (t !== 'system') root.setAttribute('data-theme', t);
    root.style.colorScheme = t === 'system' ? 'light dark' : t;
    var dunkel = t === 'dark' || (t === 'system' && !matchMedia('(prefers-color-scheme: light)').matches);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', dunkel ? '#17120e' : '#f6f1e9');
  } catch (e) { /* dann eben spaeter */ }
})();
</script>
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-logo">W</div>
  <p>Wissenswerk wird geladen …</p>
  <!-- Beim ersten Start kommen gut 240 kB Karten herunter. Auf langsamem
       Mobilfunk dauert das mehrere Sekunden - ohne Erklaerung wirkt das wie
       ein Haenger. Der Hinweis erscheint erst, wenn es wirklich lange dauert. -->
  <p id="bootHinweis" class="boot-hinweis" hidden>Beim ersten Start werden alle Karten
    geladen. Danach startet die App sofort – auch ohne Netz.</p>
</div>
<script>setTimeout(function () {
  var h = document.getElementById('bootHinweis');
  if (h && document.getElementById('boot')) h.hidden = false;
}, 1500);</script>
