# Wissenswerk – statische PWA. Der Build erneuert nur den Service-Worker-Cache.
[build]
  publish = "."
  command = "node scripts/make-sw.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "SAMEORIGIN"

# Der Service Worker darf nie aus dem Cache kommen, sonst bleiben Updates hängen.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Bewusst KEINE Weiterleitung /* -> /index.html:
# Die App hat keine clientseitigen Routen. Die Regel wuerde jede fehlende Datei
# als HTML mit Status 200 ausliefern - der Service Worker legte das dann als
# vermeintlich gueltiges JS-Modul in den Cache, und der Fehler waere kaum zu finden.
